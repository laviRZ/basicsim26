# Translates the English docs (README.md, EXERCISES.md) into Hebrew and Spanish with Claude, and
# opens or updates one pull request with the result for review. Merging it publishes the
# translations through docs-site.yml.
#
# Needs, once, in the repository settings:
#   - Secrets and variables > Actions: a secret named ANTHROPIC_API_KEY.
#   - Actions > General > Workflow permissions: "Allow GitHub Actions to create and approve pull
#     requests".
name: Translate docs

on:
  push:
    branches: [master]
    paths:
      - README.md
      - EXERCISES.md
      - tools/translate_docs.py
      - docs/requirements.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One translation run at a time, so two quick pushes never write the same branch at once.
concurrency:
  group: docs-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      BRANCH: docs/translations
    steps:
      - uses: actions/checkout@v4

      # Start from the translations already waiting for review, so a second push before the pull
      # request is merged only translates what changed since, instead of everything again.
      - name: Reuse unmerged translations
        run: |
          if git fetch --depth=1 origin "$BRANCH"; then
            git checkout FETCH_HEAD -- docs/i18n || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - name: Translate what changed
        run: python tools/translate_docs.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH }}
          add-paths: docs/i18n
          commit-message: Update the Hebrew and Spanish docs
          title: Update the Hebrew and Spanish docs
          body: |
            Claude translated the English docs sections that changed. These files are generated:
            to change a translation, change the English or the context in
            `tools/translate_docs.py`, and this pull request updates itself.

            Skim the pages in `docs/i18n/`, then merge to publish them on the docs site.
          delete-branch: true
