# Builds the docs website (English, Hebrew, Spanish) and publishes it to GitHub Pages.
#
# Needs, once, in the repository settings: Pages > Build and deployment > Source: "GitHub
# Actions".
name: Docs site

on:
  push:
    branches: [master]
    paths:
      - README.md
      - EXERCISES.md
      - docs/**
      - mkdocs.yml
      - tools/build_docs_site.py
      - tools/translate_docs.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - name: Build the site
        run: python tools/build_docs_site.py
        env:
          NO_MKDOCS_2_WARNING: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
